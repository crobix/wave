name: Build App
run-name: Creating Production Ready 🚀
on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: develop-build

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: install dependencies
        run: npm ci

      - name: Create Build Folder
        run: npm run build-prod

      - name: Add android folder if not present
        run: if [ ! -d "./android" ]; then npx cap add android; fi

      - name: Capacitor copy
        run: npx cap sync

      - name: Build app bundle
        run: cd android && ./gradlew bundle && ./gradlew assembleDebug

      - name: Set Tag
        id: current-datetime
        run: echo "CURRENT_DATETIME=$(date +'%Y-%m-%d-%H_%M_%S%z')" >> "$GITHUB_OUTPUT"

      - name: Build Release
        shell: bash
        run: gh release create "$tag" ./android/app/build/outputs/apk/debug/*.apk --repo="$GITHUB_REPOSITORY" --title="${tag#v}" --generate-notes --latest
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          tag: ${{ github.ref_name }}

