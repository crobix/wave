name: Build IOS
run-name: Creating Production Ready 🚀
on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: macos-latest
    steps:
    -
      name: checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x

    - name: install dependencies
      run: npm ci

    - name: Install CocoaPods
      run: sudo gem install cocoapods

    - name: Create Build Folder
      run: npm run build-prod

    - name: Capacitor copy
      run: npx cap sync && cd ios/App && pod install

    - name: Build IPA
      run: cd ios/App && xcodebuild -project App.xcodeproj -scheme "App" -sdk iphoneos -configuration Debug -destination generic/platform=iOS archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    -
      name: export ipa
      env:
        EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
      run: |
          EXPORT_OPTS_PATH=$RUNNER_TEMP/ExportOptions.plist
          echo -n "$EXPORT_OPTIONS_PLIST" | base64 --decode -o $EXPORT_OPTS_PATH
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist $EXPORT_OPTS_PATH -exportPath $RUNNER_TEMP/build
