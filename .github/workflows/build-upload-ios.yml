name: Build App
run-name: Creating Production Ready 🚀
on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: macos-latest
    steps:
    -
      name: checkout repository
      uses: actions/checkout@v4

    -
      name: build archive
      run: cd ios && xcodebuild clean -scheme "I am Groot" -workspace App.xcworkspace -sdk iphoneos  -configuration Debug  -destination generic/platform=iOS archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -archivePath build/YourApp.xcarchive

    -
      name: export ipa
      env:
        EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
      run: |
          EXPORT_OPTS_PATH=$RUNNER_TEMP/ExportOptions.plist
          echo -n "$EXPORT_OPTIONS_PLIST" | base64 --decode -o $EXPORT_OPTS_PATH
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist $EXPORT_OPTS_PATH -exportPath $RUNNER_TEMP/build
